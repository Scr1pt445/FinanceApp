name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  # The Android app (ADR 0013) builds on its own: the desktop job needs neither the MAUI workload nor an Android SDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK packages the project needs
        run: >
          dotnet build src/FinanceApp.Mobile -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # Every screen is built off the phone, under the app's theme, on a real database.
      - name: Test the screens
        run: dotnet test --project tests/FinanceApp.Mobile.Tests

      - name: Build the debug APK
        run: tools/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-debug-apk
          path: artifacts/android/FinanceApp-debug.apk
