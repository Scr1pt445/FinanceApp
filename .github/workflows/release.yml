name: Release

# A tag like v1.0.0 builds the signed Android APK and publishes it in GitHub Releases (ADR 0013). Run by hand
# («Run workflow» on main), it does the same for the version in Directory.Build.props and creates its tag.
# The signing key lives only in the repository secrets:
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64-encoded (base64 -w0 financeapp-release.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password (the key has the same one)
#   ANDROID_KEY_ALIAS          the key's alias (financeapp)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK packages the project needs
        run: >
          dotnet build src/FinanceApp.Mobile -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Test the screens
        run: dotnet test --project tests/FinanceApp.Mobile.Tests

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINANCEAPP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINANCEAPP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Секреты ключа подписи не заданы (см. начало release.yml)."; exit 1; }
          export FINANCEAPP_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$FINANCEAPP_KEYSTORE"
          tools/build-android-release.sh "$ANDROID_HOME"
          rm -f "$FINANCEAPP_KEYSTORE"

      # A pushed tag names the release; run by hand, the version of the build does, and its tag is made here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          fi
          # The text from docs/release-notes/<tag>.md (Russian and English); GitHub's list of changes without one.
          notes=(--generate-notes)
          [ -f "docs/release-notes/$tag.md" ] && notes=(--notes-file "docs/release-notes/$tag.md")
          gh release create "$tag" artifacts/android/FinanceApp-*.apk \
            --target "$GITHUB_SHA" --title "FinanceApp ${tag#v}" "${notes[@]}"
